resources:
  jobs:
    ams_gold:
      name: ams_gold

      max_concurrent_runs: 1

      trigger:
        pause_status: UNPAUSED
        table_update:
          condition: ANY_UPDATED
          table_names:
            - workspace.gagealspach.shipments_stream_silver
            - workspace.gagealspach.shipments_batch_silver
          wait_after_last_change_seconds: 15

      tasks:
        - task_key: refresh_gold
          pipeline_task:
            pipeline_id: ${resources.pipelines.ams_gold_etl.id}