resources:
  jobs:
    ams_demo_ingestion:
      name: ams_demo_ingestion

      max_concurrent_runs: 1

      schedule:
        quartz_cron_expression: "0 0/5 * * * ?"
        timezone_id: "America/Los_Angeles"
        pause_status: UNPAUSED

      tasks:
        - task_key: run_ams_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.ams_demo_etl.id}