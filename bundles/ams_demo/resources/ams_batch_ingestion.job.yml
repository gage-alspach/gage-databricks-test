resources:
  jobs:
    ams_batch_ingestion:
      name: ams_batch_ingestion

      max_concurrent_runs: 1

      schedule:
        quartz_cron_expression: "0 1/5 * * * ?"
        timezone_id: "America/Los_Angeles"
        pause_status: UNPAUSED

      tasks:
        - task_key: ingest_batch_files
          notebook_task:
            notebook_path: ../../../src/data_platform/lakeflow/ams_demo/batch/ingestion/batch_ingest.ipynb

        - task_key: refresh_batch_silver
          depends_on:
            - task_key: ingest_batch_files

          pipeline_task:
            pipeline_id: ${resources.pipelines.ams_batch_etl.id}