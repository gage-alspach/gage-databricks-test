resources:
  jobs:
    ams_demo_continuous:
      name: ams_demo_continuous

      continuous:
        pause_status: UNPAUSED
        task_retry_mode: ON_FAILURE

      max_concurrent_runs: 1

      tasks:
        - task_key: run_ams_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.ams_demo_etl.id}